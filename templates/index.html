<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Based Legal Contract Analyzer</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                        <rect width="40" height="40" rx="8" fill="url(#gradient)" />
                        <path d="M20 10L28 16V24L20 30L12 24V16L20 10Z" stroke="white" stroke-width="2" fill="none" />
                        <defs>
                            <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                                <stop offset="0%" stop-color="#667eea" />
                                <stop offset="100%" stop-color="#764ba2" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>RAG Based Legal Contract Analyzer</h1>
                    <p class="logo-subtitle">AI-Powered Contract Analysis</p>
                </div>
            </div>
            <div class="user-section">
                <div class="user-info">
                    <div class="user-avatar">{{ user.name[0].upper() }}</div>
                    <div class="user-details">
                        <span class="user-name">{{ user.name }}</span>
                        <span class="user-email">{{ user.email }}</span>
                    </div>
                </div>
                <a href="/logout" class="logout-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Logout
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Upload Section -->
        <div class="upload-section">
            <div class="upload-card">
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" accept=".pdf" hidden>
                    <label for="fileInput" class="file-label">
                        <div class="upload-icon">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                        </div>
                        <p class="upload-text">Click to select PDF document</p>
                        <p class="upload-subtext">or drag and drop here</p>
                    </label>
                </div>

                <div id="fileName" class="file-name"></div>

                <button id="uploadBtn" class="upload-btn" disabled>
                    <span>Upload & Analyze</span>
                </button>

                <!-- Progress Circle -->
                <div id="progressContainer" class="progress-container" style="display: none;">
                    <svg class="progress-ring" width="120" height="120">
                        <circle class="progress-ring-circle-bg" cx="60" cy="60" r="54"></circle>
                        <circle class="progress-ring-circle" cx="60" cy="60" r="54"></circle>
                    </svg>
                    <div class="progress-text">
                        <div class="progress-percentage">0%</div>
                        <div class="progress-label">Processing...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="results-section" style="display: none;">
            <div class="results-grid">
                <!-- Summary Card -->
                <div class="result-card summary-card">
                    <div class="card-header">
                        <div class="card-icon summary-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                <polyline points="10 9 9 9 8 9"></polyline>
                            </svg>
                        </div>
                        <h3>Contract Summary</h3>
                    </div>
                    <div id="summaryContent" class="card-content"></div>
                </div>

                <!-- Clauses Card -->
                <div class="result-card clauses-card">
                    <div class="card-header">
                        <div class="card-icon clauses-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <polyline points="9 11 12 14 22 4"></polyline>
                                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                            </svg>
                        </div>
                        <h3>Key Clauses</h3>
                    </div>
                    <div id="clausesContent" class="card-content"></div>
                </div>

                <!-- Risks Card -->
                <div class="result-card risks-card">
                    <div class="card-header">
                        <div class="card-icon risks-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path
                                    d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                                </path>
                                <line x1="12" y1="9" x2="12" y2="13"></line>
                                <line x1="12" y1="17" x2="12.01" y2="17"></line>
                            </svg>
                        </div>
                        <h3>Risk Analysis</h3>
                    </div>
                    <div id="risksContent" class="card-content"></div>
                </div>
            </div>

            <!-- Risk Score Card -->
            <div id="riskScoreCard" class="risk-score-card" style="display: none;">
                <div class="risk-score-header">
                    <div class="risk-score-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                        </svg>
                    </div>
                    <h3>Contract Risk Score</h3>
                </div>
                <div class="risk-score-content">
                    <div class="risk-score-display">
                        <div class="risk-score-number" id="riskScoreNumber">0</div>
                        <div class="risk-score-label" id="riskScoreLabel">Low Risk</div>
                    </div>
                    <div class="risk-score-bar-container">
                        <div class="risk-score-bar" id="riskScoreBar"></div>
                    </div>
                    <div class="risk-score-description" id="riskScoreDescription"></div>
                </div>
            </div>
        </div>

        <!-- Q&A Section -->
        <div id="qaSection" class="qa-section" style="display: none;">
            <div class="qa-card">
                <div class="qa-header">
                    <div class="qa-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                    </div>
                    <h3>Ask Questions</h3>
                </div>

                <div id="chatContainer" class="chat-container"></div>

                <div class="input-container">
                    <input type="text" id="questionInput" placeholder="Ask a question about the contract..." />
                    <button id="askBtn" class="ask-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>

</html>
